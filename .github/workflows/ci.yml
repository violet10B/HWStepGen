name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Environments from platformio.ini, which also pins the platform
        # versions. Building via the envs (instead of pio ci --board) matters
        # for the C6/H2/P4: their board IDs only exist inside the pioarduino
        # platform, and pio ci validates --board against the registry before
        # the platform is installed.
        include:
          - { name: "ESP32 (core 2.x)",    env: esp32dev }
          - { name: "ESP32-S2 (core 2.x)", env: esp32-s2 }
          - { name: "ESP32-S3 (core 2.x)", env: esp32-s3 }
          - { name: "ESP32-C3 (core 2.x)", env: esp32-c3 }
          - { name: "ESP32 (core 3.x)",    env: esp32dev-core3 }
          - { name: "ESP32-S2 (core 3.x)", env: esp32-s2-core3 }
          - { name: "ESP32-S3 (core 3.x)", env: esp32-s3-core3 }
          - { name: "ESP32-C3 (core 3.x)", env: esp32-c3-core3 }
          - { name: "ESP32-C6",            env: esp32-c6 }
          - { name: "ESP32-H2",            env: esp32-h2 }
          - { name: "ESP32-P4",            env: esp32-p4 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Cache toolchains and frameworks, but never ~/.platformio/penv: the
      # pioarduino platform rebuilds it on the fly, and a half-finished
      # rebuild cached from a failed job breaks every later run.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-v2-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v2-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build examples
        run: |
          set -euo pipefail
          for example in examples/*/; do
            echo "::group::$(basename "$example")"
            PLATFORMIO_SRC_DIR="$PWD/$example" pio run -e "${{ matrix.env }}"
            echo "::endgroup::"
          done

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          find src -type f \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          # Not in the Arduino Library Manager index yet; switch to "submit"
          # when applying for inclusion.
          library-manager: false
          compliance: strict
          project-type: library
