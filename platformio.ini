; Development configuration for building the examples across the ESP32
; family. Library consumers do not need this file; they add
; lib_deps = https://github.com/violet10B/HWStepGen.git to their own.
;
; pio run -e esp32dev builds one example; change src_dir to pick another.

[platformio]
src_dir = examples/BasicSingleMotor
default_envs = esp32dev

[env]
framework = arduino
lib_deps = symlink://.
build_flags =
    -Wall
    -Wextra
monitor_speed = 115200

; Arduino core 2.x: the official espressif32 platform, frozen at core 2.0.17.
; Covers the ESP32, S2, S3 and C3; newer variants need core 3.x below.
[core2x]
platform = espressif32@6.10.0
extends = env

[env:esp32dev]
extends = core2x
board = esp32dev

[env:esp32-s2]
extends = core2x
board = esp32-s2-saola-1

[env:esp32-s3]
extends = core2x
board = esp32-s3-devkitc-1

[env:esp32-c3]
extends = core2x
board = esp32-c3-devkitm-1

; Arduino core 3.x via the pioarduino platform (the official one stopped at
; 2.0.17). Keep the release tag in sync with .github/workflows/ci.yml; tags:
; https://github.com/pioarduino/platform-espressif32/releases
[core3x]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
extends = env

[env:esp32dev-core3]
extends = core3x
board = esp32dev

[env:esp32-s2-core3]
extends = core3x
board = esp32-s2-saola-1

[env:esp32-s3-core3]
extends = core3x
board = esp32-s3-devkitc-1

[env:esp32-c3-core3]
extends = core3x
board = esp32-c3-devkitm-1

[env:esp32-c6]
extends = core3x
board = esp32-c6-devkitc-1

[env:esp32-h2]
extends = core3x
board = esp32-h2-devkitm-1

[env:esp32-p4]
extends = core3x
board = esp32-p4-evboard
