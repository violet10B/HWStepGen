sentence=Stepper motor speed control for the ESP32 family, driven by the LEDC peripheral.
paragraph=STEP pulses come from the LEDC peripheral instead of a software timer, so the pulse rate is unaffected by CPU load, WiFi or blocking code. Supports ESP32, S2, S3, C3, C6, H2 and P4 on Arduino core 2.x and 3.x, with automatic channel allocation, non-blocking acceleration ramps, ENABLE pin control and microstepping-aware speed conversion.
